name: verify-selector-repair
on:
  push:
    branches:
      - fix/price-signals-selectors-coverage
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:desk
      - run: npm run test:trade
      - run: npm run test:prices
      - run: npm run test:controls
      - run: npm run typecheck

  live:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:prices:live
      - run: npm run test:trade:live
