name: Trade Flows validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run test:desk
      - run: npm run test:trade
      - name: Live Eurostat and HMRC verification
        run: |
          node --conditions=react-server --experimental-strip-types --input-type=module <<'NODE'
          import {fetchLatestAvailableMonth, fetchTradeRecords} from './src/lib/trade/comext.ts';
          import {fetchHmrcLatestAvailableMonth, fetchHmrcTradeRecords} from './src/lib/trade/hmrc.ts';
          import {isCountryPartner} from './src/lib/trade/calculations.ts';

          const euroLatest = await fetchLatestAvailableMonth('DE', ['080550'], 'imports');
          const euroRecords = (await fetchTradeRecords('DE', ['080550'], 'imports', euroLatest, euroLatest))
            .filter(record => isCountryPartner(record.partnerCode) && record.tradeValue != null && record.quantityKg != null && record.quantityKg > 0);
          if (!euroRecords.length) throw new Error('Eurostat live verification returned no complete country rows');
          const euroTop = euroRecords.slice().sort((a, b) => (b.quantityKg ?? 0) - (a.quantityKg ?? 0))[0];
          const euroUnit = euroTop.tradeValue / euroTop.quantityKg;
          console.log(`EU LIVE OK | lemons/limes | Germany imports | through ${euroLatest} | origins ${new Set(euroRecords.map(row => row.partnerCode)).size} | leading ${euroTop.partnerName} | EUR ${euroTop.tradeValue.toFixed(0)} | kg ${euroTop.quantityKg.toFixed(0)} | EUR/kg ${euroUnit.toFixed(4)}`);

          const ukLatest = await fetchHmrcLatestAvailableMonth(['08061010'], 'imports');
          const ukRecords = (await fetchHmrcTradeRecords(['08061010'], 'imports', ukLatest, ukLatest))
            .filter(record => isCountryPartner(record.partnerCode) && record.tradeValue != null && record.quantityKg != null && record.quantityKg > 0);
          if (!ukRecords.length) throw new Error('HMRC live verification returned no complete country rows');
          const ukTop = ukRecords.slice().sort((a, b) => (b.quantityKg ?? 0) - (a.quantityKg ?? 0))[0];
          const ukUnit = ukTop.tradeValue / ukTop.quantityKg;
          console.log(`UK LIVE OK | table grapes | UK imports | through ${ukLatest} | origins ${new Set(ukRecords.map(row => row.partnerCode)).size} | leading ${ukTop.partnerName} | GBP ${ukTop.tradeValue.toFixed(0)} | kg ${ukTop.quantityKg.toFixed(0)} | GBP/kg ${ukUnit.toFixed(4)}`);
          NODE
