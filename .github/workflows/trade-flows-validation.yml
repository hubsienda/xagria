name: Trade Flows validation

on:
  push:
    branches:
      - feat/trade-flows-products-uk

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desk
      - run: npm run test:trade
      - run: npm run build
